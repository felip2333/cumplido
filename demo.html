<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demos interactivos de Cumplido — Checklists operativos, APPCC y Dashboard financiero para restaurantes.">
  <title>Demos — Cumplido</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 4C11.16 4 4 11.16 4 20s7.16 16 16 16c2.8 0 5.44-.72 7.74-2' stroke='%230D7C66' stroke-width='4' stroke-linecap='round' fill='none'/><polyline points='12 20 18 26 32 12' fill='none' stroke='%230D7C66' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0d;
      --surface: #131518;
      --surface2: #1a1d21;
      --border: #262a30;
      --primary: #0D7C66;
      --primary-light: #0fa37f;
      --primary-tint: rgba(13,124,102,0.12);
      --text: #f2f0ec;
      --text-muted: #8a8d92;
      --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 1.5rem;
      background: rgba(10,11,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-logo { display: flex; align-items: center; text-decoration: none; }
    .header-logo img { height: 3.5rem; width: auto; }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
      text-align: center;
    }
    .content h1 {
      font-size: 1.8rem; font-weight: 800;
      margin-bottom: 0.4rem;
    }
    .content h1 span { color: var(--primary-light); }
    .content p {
      color: var(--text-muted); font-size: 0.95rem;
      max-width: 400px; margin-bottom: 2.5rem;
    }
    .demos {
      display: flex; gap: 1.2rem;
      max-width: 700px; width: 100%;
    }
    .demo-card {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }
    .demo-card:hover {
      border-color: var(--primary);
      background: var(--surface2);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(13,124,102,0.15);
    }
    .demo-icon {
      width: 64px; height: 64px;
      background: var(--primary-tint);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.2rem;
    }
    .demo-icon svg { width: 30px; height: 30px; color: var(--primary-light); }
    .demo-card h2 {
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .demo-card p {
      font-size: 0.8rem; color: var(--text-muted);
      line-height: 1.5; margin-bottom: 1.2rem;
    }
    .demo-tag {
      font-size: 0.65rem; font-weight: 600;
      color: var(--primary-light);
      background: var(--primary-tint);
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    @media (max-width: 550px) {
      .demos { flex-direction: column; }
      .content h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header class="header">
  <a href="/" class="header-logo">
    <img src="logo-solo.png" alt="Cumplido">
  </a>
</header>

<main class="content">
  <h1>Prueba <span>Cumplido</span></h1>
  <p>Elige el producto que quieres explorar</p>

  <div class="demos">
    <a href="/demo-checklists.html" class="demo-card">
      <div class="demo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <polyline points="9 11 12 14 16 9"/>
        </svg>
      </div>
      <h2>Checklists & APPCC</h2>
      <p>Checklists por turno, registros de limpieza y control de temperaturas APPCC</p>
      <span class="demo-tag">Demo interactivo</span>
    </a>

    <a href="/demo-dashboard.html" class="demo-card">
      <div class="demo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="4" rx="1.5"/>
          <rect x="3" y="14" width="7" height="4" rx="1.5"/>
          <rect x="14" y="11" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h2>Dashboard financiero</h2>
      <p>Ventas, costes, compras y métricas clave de tu restaurante en tiempo real</p>
      <span class="demo-tag">Demo interactivo</span>
    </a>
  </div>
</main>

</body>
</html>
